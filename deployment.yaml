apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: nginx

  template:
    metadata:
      labels:
        app: nginx

    spec:
      containers:
        - name: nginx
          image: moh001/shop-matger:latest 
          ports:
            - containerPort: 80